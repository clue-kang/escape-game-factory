name: Gemini 키 점검

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow
      - name: 키 점검
        id: chk
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/check_gemini.py
      - name: 결과 요약
        if: always()
        run: |
          echo "## 🔑 Gemini 키 점검 결과" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**${{ steps.chk.outputs.result || '실패 — 아래 로그를 보세요' }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "키가 없거나 실패해도 게임은 OCR로 계속 만들어집니다." >> $GITHUB_STEP_SUMMARY
