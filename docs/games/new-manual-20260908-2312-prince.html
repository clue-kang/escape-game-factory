<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🌹 소행성 B612</title>
<style>
  :root{
    --bg1:#05070f; --bg2:#141a3c;
    --card:rgba(0,0,0,.55);
    --line:rgba(255,150,170,.38);
    --ink:#f8f2e8; --dim:#c6b8a4;
    --amber:#ff9aae; --lime:#ffd76e; --red:#f4666f; --paper:#eef1fb;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{min-height:100vh;color:var(--ink);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;
    background:radial-gradient(1100px 640px at 50% -8%,var(--bg2) 0%,var(--bg2) 30%,var(--bg1) 100%);
    overflow-x:hidden;line-height:1.6}
  #sky{position:fixed;inset:0;z-index:0;pointer-events:none}
  .em{position:absolute;border-radius:50%;background:var(--amber);box-shadow:0 0 9px var(--amber);
      opacity:.4;animation:tw 5s infinite ease-in-out}
  @keyframes tw{0%,100%{opacity:.05}50%{opacity:.65}}
  .wrap{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:12px 14px 44px}
  #hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(0,0,0,.6);
    border:1px solid var(--line);border-radius:16px;padding:10px 12px;backdrop-filter:blur(6px);margin-bottom:14px}
  #hud.hide{display:none}
  .gauge{flex:1 1 160px;min-width:132px}
  .gauge .lab{font-size:.78rem;color:var(--dim);display:flex;justify-content:space-between}
  .bar{height:12px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:4px}
  .bar>i{display:block;height:100%;width:100%;border-radius:99px;
    background:linear-gradient(90deg,var(--lime),var(--amber));transition:width .8s linear}
  .bar.low>i{background:linear-gradient(90deg,#f59e0b,#f4666f)}
  .hudbtn{background:rgba(255,255,255,.1);border:1px solid var(--line);color:var(--ink);
    border-radius:12px;padding:8px 12px;font-size:.9rem;cursor:pointer;font-family:inherit}
  .hudbtn:active{transform:scale(.96)}
  .volwrap{display:flex;flex-direction:column;gap:5px;flex:0 0 104px}
  #vol{width:104px;height:16px;accent-color:var(--amber);cursor:pointer;margin:0}
  .meter{height:6px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
  .meter>i{display:block;height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,var(--lime),var(--amber));transition:width .08s linear}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:0 0 20px;
    backdrop-filter:blur(9px);box-shadow:0 20px 54px rgba(0,0,0,.6);overflow:hidden}
  .inner{padding:0 18px}
  .card.shake{animation:sh .42s}
  @keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
  h1{font-size:1.95rem;margin:.15em 0 .3em;text-align:center;letter-spacing:-1px}
  h2{font-size:1.32rem;margin:.1em 0 .5em;letter-spacing:-.5px}
  p{margin:.5em 0}
  .center{text-align:center}.dim{color:var(--dim)}.small{font-size:.88rem}
  .photo{position:relative;width:100%;overflow:hidden}
  .photo img{width:100%;display:block;height:auto}
  .photo .shade{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.1) 42%,rgba(0,0,0,.88) 100%)}
  .photo .cap{position:absolute;left:0;right:0;bottom:10px;text-align:center;
    font-size:1.02rem;font-weight:800;letter-spacing:-.3px;text-shadow:0 2px 10px #000;padding:0 14px}
  .photo .top{position:absolute;left:0;right:0;top:9px;text-align:center;font-size:.86rem;
    color:var(--amber);font-weight:800;text-shadow:0 2px 8px #000;letter-spacing:.5px}
  .grain{position:absolute;inset:0;opacity:.15;mix-blend-mode:overlay;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.55) .5px,transparent .5px);background-size:3px 3px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 8px}
  .badge{background:rgba(255,255,255,.1);border:1px solid var(--line);color:var(--amber);
    border-radius:99px;padding:4px 12px;font-size:.82rem;white-space:nowrap}
  .tag{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--lime);
    border-radius:99px;padding:4px 12px;font-size:.82rem;white-space:nowrap}
  .figure{background:var(--paper);border-radius:16px;padding:10px;margin:14px 0;display:flex;justify-content:center;
    box-shadow:inset 0 0 40px rgba(120,86,32,.25)}
  .figure svg{width:100%;max-width:420px;height:auto;display:block}
  .prompt{font-size:1.13rem;font-weight:700;text-align:center;margin:14px 0 10px}
  .slots{display:flex;gap:10px;justify-content:center;margin:6px 0 14px}
  .slot{width:56px;height:66px;border-radius:12px;background:rgba(255,255,255,.08);
    border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800}
  .slot.on{border-color:var(--amber);background:rgba(255,255,255,.16)}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:330px;margin:0 auto}
  .pad button{font-family:inherit;font-size:1.5rem;font-weight:700;color:var(--ink);
    background:rgba(255,255,255,.09);border:1px solid var(--line);border-radius:13px;padding:14px 0;cursor:pointer}
  .pad button:active{transform:scale(.94);background:rgba(255,255,255,.24)}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:460px;margin:0 auto}
  .choices button{font-family:inherit;font-size:1.3rem;font-weight:700;color:var(--ink);
    background:rgba(255,255,255,.09);border:1px solid var(--line);border-radius:16px;padding:16px 8px;cursor:pointer;min-height:64px}
  .choices button:active{transform:scale(.96);background:rgba(255,255,255,.22)}
  .choices.img button{padding:8px 8px 6px}
  .choices.img img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:11px;display:block}
  .choices.img .cl{display:block;font-size:1rem;color:var(--ink);margin-top:7px;font-weight:700}
  .big{display:block;width:100%;max-width:430px;margin:16px auto 0;font-family:inherit;font-size:1.2rem;
    font-weight:800;color:#1a1206;cursor:pointer;background:linear-gradient(90deg,var(--amber),var(--lime));
    border:0;border-radius:15px;padding:16px}
  .big:active{transform:scale(.97)}
  .ghost{background:rgba(255,255,255,.1);color:var(--ink);border:1px solid var(--line)}
  .fb{text-align:center;font-size:1.15rem;font-weight:800;min-height:1.7em;margin-top:12px}
  .fb.ok{color:var(--lime)}.fb.no{color:var(--red)}
  .hintbox{margin-top:14px}
  .hintbtn{width:100%;font-family:inherit;font-size:1rem;color:var(--amber);
    background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
  .hint{background:rgba(255,255,255,.07);border-left:4px solid var(--amber);border-radius:10px;padding:10px 12px;margin-top:9px;font-size:1rem}
  .modal{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;padding:16px}
  .modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:18px;max-width:540px;width:100%;max-height:84vh;overflow:auto}
  .noteitem{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px dashed rgba(255,255,255,.16)}
  .noteitem b{color:var(--amber);font-size:1.15rem}
  .steps{display:flex;gap:6px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
  .dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.2)}
  .dot.on{background:var(--amber)}.dot.now{background:var(--lime);transform:scale(1.35)}
  footer{text-align:center;color:var(--dim);font-size:.76rem;margin-top:22px;line-height:1.7}
  footer button{background:none;border:0;color:var(--dim);font-size:.76rem;cursor:pointer;font-family:inherit;text-decoration:underline}
  @media(max-width:420px){
    .slot{width:48px;height:58px;font-size:1.6rem}
    .choices button{font-size:1.06rem}
    h1{font-size:1.5rem}
    #hud{gap:6px;padding:8px 9px}.hudbtn{padding:6px 9px;font-size:.8rem}
    .gauge{flex:1 1 100px;min-width:92px}
    .wrap{padding:10px 10px 34px}.inner{padding:0 13px}
  }
</style>
</head>

    <div class="gauge">

</div>

   '<div class="noteitem"><span>💡 사용한 힌트</span><b>'+st.hints+'개</b></div>'+
   '<div class="noteitem"><span>🔁 다시 시도</span><b>'+st.wrong+'번</b></div>'+
   '<div class="noteitem" style="border:0"><span>🏅 훈장</span><b>'+m+'</b></div></div>'+
   '<button class="big" id="again">🔁 다시 도전</button>'+
   '<button class="big ghost" id="n2">📓 단서 노트</button></div></div>';
  document.getElementById('again').onclick=function(){
    st={view:'intro',z:0,q:0,hint:0,input:'',start:null,hints:0,wrong:0,notes:[],done:false};render();};
  document.getElementById('n2').onclick=notes;
}
function modal(h){const d=document.createElement('div');d.className='modal';
  d.innerHTML='<div class="box">'+h+'<button class="big ghost" style="margin-top:16px">닫기</button></div>';
  d.querySelector('button.big').onclick=function(){d.remove();};
  d.onclick=function(e){if(e.target===d)d.remove();};
  document.body.appendChild(d);}
function notes(){
  const r=st.notes.length?st.notes.map(function(n){return '<div class="noteitem"><span>'+n.id+'번 · '+n.title+'</span><b>'+n.ans+'</b></div>';}).join('')
   :'<p class="dim center">아직 푼 문제가 없어요.</p>';
  modal('<h2>📓 단서 노트</h2><p class="small dim">지금까지 맞힌 답이에요.</p>'+r);}
document.getElementById('btnNotes').onclick=notes;
document.getElementById('btnSound').onclick=function(){
  soundOn=!soundOn;
  if(!soundOn){stopAmb(); if(MST)MST.gain.value=0;}
  else{A(); if(MST)MST.gain.value=vol; ambience(lastZone); sDrum(.7,190);}
  badge();};
document.getElementById('vol').oninput=function(e){A();setVol(e.target.value/100);};
document.getElementById('btnParent').onclick=function(){
  const v=prompt('부모님 확인용 문제입니다.\n17 × 13 = ?');
  if(v===null)return;
  if(v.trim()!=='221'){alert('아직은 볼 수 없어요! 조금 더 힘내 봐요 💪');return;}
  let h='<h2>🔑 부모님용 정답지</h2><p class="small dim">'+GAME.title+'</p>';
  GAME.zones.forEach(function(z,i){h+='<p style="margin-top:14px"><b>'+z.icon+' 구역 '+(i+1)+' · '+z.name+'</b></p>';
    GAME.qs.filter(function(q){return q.zone===i;}).forEach(function(q){
      h+='<div class="noteitem"><span>'+q.id+'번 · '+q.title+'</span><b>'+q.ans+'</b></div>';});});
  modal(h);};
render();
</script>
</body>
</html>
